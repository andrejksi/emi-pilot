# The EMI pilot. One job per task runs every arm x (replayed change | seed)
# of that task in turn, sharing one environment, then grades those runs with
# the hidden tests; a last job makes the table.
#
# No run has the hidden tests: the job deletes them, and the repository's git
# history, before any run, keeps no credentials, and fetches them back only
# after the last run has ended. The agent's own commands run without network.
name: pilot

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "replay (fixed changes, no model) or chat (a live model)"
        type: choice
        options: [replay, chat]
        default: replay
      seeds:
        description: "chat: runs per task and arm"
        default: "3"
      base_url:
        description: "chat: OpenAI-compatible endpoint, e.g. https://host/v1"
        default: ""
      model:
        description: "chat: model name at that endpoint"
        default: ""
      tasks:
        description: "tasks to run: @toy, @a, @b (batches/*.txt) or task ids, space-separated"
        default: "@toy"

permissions:
  contents: read

env:
  EMI_VERSION: "0.1.1"   # one reviewed release for every arm

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          TASKS: ${{ inputs.tasks }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          # shellcheck disable=SC2086 # TASKS is a list of words
          python3 harness/plan.py '${{ inputs.backend }}' --seeds "$SEEDS" ${TASKS:+--tasks $TASKS} | tee -a "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          tasks="$(python3 harness/plan.py '${{ inputs.backend }}' --seeds "$SEEDS" ${TASKS:+--tasks $TASKS} --task-list)"
          echo "tasks=$tasks" >>"$GITHUB_OUTPUT"

  agent:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 15   # one job per task; under the free plan's 20 at once
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove the hidden tests and the history before any run
        run: rm -rf .git tasks/*/hidden
      - name: Sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: EMI, uv, and the toy projects' test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install -q "emicode==$EMI_VERSION" uv
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"   # uv builds each real task's environment
          python3 -m venv "$RUNNER_TEMP/project-venv"
          "$RUNNER_TEMP/project-venv/bin/pip" install -q 'pytest>=8,<9' 'coverage>=7.9,<8' 'hypothesis>=6,<7'
      - name: Runs
        env:
          EMI: ${{ runner.temp }}/tools/bin/emi
          VENV: ${{ runner.temp }}/project-venv
          WORK: ${{ runner.temp }}/work
          MODEL_API_KEY: ${{ inputs.backend == 'chat' && secrets.MODEL_API_KEY || '' }}
          # passed through the environment, never pasted into the script
          MODEL_BASE_URL: ${{ inputs.base_url }}
          MODEL_NAME: ${{ inputs.model }}
          SEEDS: ${{ inputs.seeds }}
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p "$WORK"
          bash harness/run_task.sh '${{ inputs.backend }}' "$SEEDS" "$TASK" out
      # the oracle runs here, in the same job, so the task's environment is
      # built once; the hidden tests are fetched only now, after every run
      # of this task has ended, so no run could have read them
      - name: Fetch the hidden tests, after every run has ended
        if: always() && hashFiles('out/**') != ''
        uses: actions/checkout@v4
        with:
          path: hidden-src
          persist-credentials: false
          sparse-checkout: tasks/${{ matrix.task }}/hidden
      - name: Judge with the hidden tests
        if: always() && hashFiles('out/**') != ''
        env:
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p "tasks/$TASK"
          cp -r "hidden-src/tasks/$TASK/hidden" "tasks/$TASK/hidden"
          python3 harness/oracle.py --venv "$RUNNER_TEMP/project-venv" --run out/*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judged-${{ matrix.task }}
          path: out/
          if-no-files-found: error

  table:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: judged-*
          path: runs/
          merge-multiple: true
      - name: Table
        run: python3 harness/table.py --by-run runs/*/ | tee table.md >>"$GITHUB_STEP_SUMMARY"
      - name: Are the real tasks sound?
        if: inputs.backend == 'replay'
        run: |
          { echo; echo "## Task check"; } >>"$GITHUB_STEP_SUMMARY"
          python3 harness/check_tasks.py runs/*/ | tee tasks.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results
          path: |
            runs/
            table.md
            tasks.md
      - name: Fail if any job failed
        if: needs.agent.result != 'success'
        run: |
          echo "some task jobs failed; see their logs" >&2
          exit 1
